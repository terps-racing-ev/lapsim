[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-lapsim"
version = "0.1.0"
description = "An extensible minimum-lap-time simulator"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
